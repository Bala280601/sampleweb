apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend

        image: bala280601/node-api:v2

        ports:
        - containerPort: 5000

        env:
        - name: DB_HOST
          value: mysql
